# NoAssume configuration — committed, shared by the team.
#
# Defaults below are opinionated. Set any clarify.* key to false to delegate
# that whole category of decisions to the agent permanently. The agent still
# records what it chose — as a DELEGATED decision with this file as source —
# so false means "don't ask", not "don't record".

# Baseline strictness: balanced | strict | critical
# Task risk escalates above this automatically. The risk floor is part of the
# protocol, not the config — it has no off switch. See references/config.md.
mode: balanced

# Decision categories that stay gated (true = ask when evidence is silent).
clarify:
  architecture: true        # component boundaries, placement, patterns
  runtime: true             # language, version, framework, toolchain
  dependencies: true        # adding, replacing, or pinning libraries
  public_interfaces: true   # API contracts, CLI flags, exported signatures
  data_model: true          # schemas, types, serialization, ownership
  persistence: true         # databases, volumes, retention, migrations
  security: true            # auth, permissions, secrets, trust boundaries
  networking: true          # ports, exposure, protocols, TLS
  deployment: true          # environments, rollout, rollback, CI/CD
  testing: true             # whether/where to test, framework, coverage
  versions: true            # exact pins when the repo doesn't pin them
  file_structure: false     # layout beyond existing repo convention
  naming: false             # names not dictated by convention
  logging: false            # log format, levels, instrumentation detail

behavior:
  # Show a recommended option on questions (recommendation, not decision).
  recommend_options: true
  # Deep discovery pass on first task; incremental verification afterwards.
  deep_repository_discovery: true
  # Guard the implementation phase, not just the gate.
  monitor_implementation: true
